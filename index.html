<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AminoLabAr · Catálogo</title>
  <meta name="description" content="En AminoLabAr trabajamos con péptidos de investigación. Priorizamos la calidad y compartimos los certificados de análisis (COA) para que puedas consultar la información de los productos. Seguimos estudiando y revisando las publicaciones sobre los péptidos que ofrecemos.

Por WhatsApp te atendemos nosotros. Podés consultar por los productos, pedir sus certificados y contar con atención personalizada antes y después de tu compra.

Elegimos un catálogo sencillo para que puedas encontrar los productos y comunicarte directamente con nuestro equipo.

Escribinos por WhatsApp para consultar por un producto o solicitar su COA.">
  <meta name="theme-color" content="#FAFAF7">
  <meta property="og:title" content="AminoLabAr · Catálogo">
  <meta property="og:description" content="Elegí tus productos, armá el pedido y envialo por WhatsApp.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E6B4E'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='700' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="saltar" id="saltar" href="#catalogo">Saltar al catálogo</a>

  <header class="encabezado" id="encabezado">
    <div class="contenedor">
      <h1 class="marca" translate="no">AminoLabAr</h1>
      <p class="descripcion" id="descripcion"><span class="esqueleto esqueleto-linea"></span><span class="esqueleto esqueleto-linea corta"></span></p>
      <div class="lecturas">
        <p class="dolar" id="dolar">
          <span class="dolar-punto" aria-hidden="true"></span>
          <span id="dolar-texto">Dólar blue: cargando…</span>
        </p>
        <ul class="datos" id="datos"></ul>
      </div>
    </div>
  </header>

  <nav class="chips" id="chips" aria-label="Categorías">
    <div class="contenedor chips-lista" id="chips-lista">
      <span class="esqueleto esqueleto-chip"></span>
      <span class="esqueleto esqueleto-chip"></span>
      <span class="esqueleto esqueleto-chip"></span>
    </div>
  </nav>

  <main class="contenedor catalogo" id="catalogo" tabindex="-1" aria-busy="true">
    <section class="grupo" aria-hidden="true">
      <div class="esqueleto esqueleto-titulo"></div>
      <div class="grilla">
        <div class="tarjeta tarjeta-esqueleto">
          <div class="tarjeta-media"><span class="esqueleto esqueleto-relleno"></span></div>
          <div class="esqueleto-nombre">
            <span class="esqueleto esqueleto-linea"></span>
            <span class="esqueleto esqueleto-linea corta"></span>
          </div>
          <span class="esqueleto esqueleto-bloque"></span>
          <span class="esqueleto esqueleto-bloque"></span>
          <span class="esqueleto esqueleto-boton"></span>
        </div>
        <div class="tarjeta tarjeta-esqueleto">
          <div class="tarjeta-media"><span class="esqueleto esqueleto-relleno"></span></div>
          <div class="esqueleto-nombre">
            <span class="esqueleto esqueleto-linea"></span>
            <span class="esqueleto esqueleto-linea corta"></span>
          </div>
          <span class="esqueleto esqueleto-bloque"></span>
          <span class="esqueleto esqueleto-bloque"></span>
          <span class="esqueleto esqueleto-boton"></span>
        </div>
        <div class="tarjeta tarjeta-esqueleto">
          <div class="tarjeta-media"><span class="esqueleto esqueleto-relleno"></span></div>
          <div class="esqueleto-nombre">
            <span class="esqueleto esqueleto-linea"></span>
            <span class="esqueleto esqueleto-linea corta"></span>
          </div>
          <span class="esqueleto esqueleto-bloque"></span>
          <span class="esqueleto esqueleto-bloque"></span>
          <span class="esqueleto esqueleto-boton"></span>
        </div>
      </div>
    </section>
  </main>

  <footer class="pie" id="pie">
    <div class="contenedor">
      <p>Los precios en pesos se calculan con el dólar blue (venta) y se actualizan solos.</p>
      <p><span translate="no">AminoLabAr</span> · Pedidos por WhatsApp</p>
    </div>
  </footer>

  <div class="barra" id="barra" hidden>
    <button class="barra-boton" id="barra-boton" type="button" aria-haspopup="dialog" aria-controls="panel">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>
      <span>Ver carrito (<span class="contador" id="barra-contador">0</span>) · <strong id="barra-total">$ 0</strong></span>
    </button>
  </div>

  <div class="fondo" id="fondo"></div>

  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-titulo" inert>
    <div class="panel-manija" aria-hidden="true"></div>
    <div class="panel-cabecera">
      <h2 class="panel-titulo" id="panel-titulo">Tu pedido</h2>
      <button class="boton-icono" id="panel-cerrar" type="button" aria-label="Cerrar">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ol class="pasos" id="pasos">
      <li class="paso" data-paso="1">
        <button class="paso-boton" type="button" data-accion="ir-paso" data-paso="1"><span class="paso-num">1</span><span class="paso-nombre">Carrito</span></button>
      </li>
      <li class="paso" data-paso="2">
        <button class="paso-boton" type="button" data-accion="ir-paso" data-paso="2"><span class="paso-num">2</span><span class="paso-nombre">Pago</span></button>
      </li>
      <li class="paso" data-paso="3">
        <button class="paso-boton" type="button" data-accion="ir-paso" data-paso="3"><span class="paso-num">3</span><span class="paso-nombre">Confirmar</span></button>
      </li>
    </ol>
    <div class="panel-cuerpo" id="panel-cuerpo"></div>
    <div class="panel-pie" id="panel-pie"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="anuncio" aria-live="polite"></div>
</body>
</html>
